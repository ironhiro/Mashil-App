# 앱 셸(Flutter) CI — 프로젝트는 app/ 아래
#   모든 push·PR: flutter analyze + flutter test
# 스토어 빌드·서명은 여기서 하지 않는다 (키와 시크릿이 필요).
name: ci

on:
  push:
    branches: ["**"]
    paths: ["app/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      # 서체 파일은 저장소에 없다 (서울남산체 재배포 금지). pubspec 의 fonts 가 가리키므로 빌드 전에 만든다
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fonts
        run: |
          pip install fonttools brotli
          python tool/make_fonts.py
      - run: flutter --version
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
